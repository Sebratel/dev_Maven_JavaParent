name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dos artefatos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install (rules + parent)
        run: ./mvnw -B install
      # Prova que as regras funcionam de verdade: um consumidor com violacao tem que FALHAR.
      - name: Teste de consumidor (regras ativas)
        run: ./scripts/test-consumer.sh

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Resultado agregado
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Pelo menos um job nao passou."; exit 1
          fi
